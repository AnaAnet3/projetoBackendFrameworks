spring.application.name=listify
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/listify?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Recife}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:COLOQUE_SUA_SENHA_AQUI}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
server.port=8080
